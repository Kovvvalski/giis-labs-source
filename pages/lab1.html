<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дифференциальный Анализатор</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            text-align: center;
        }

        canvas {
            border: 1px solid black;
            cursor: crosshair;
        }
    </style>

</head>
<body>
<h2 class="mt-3">Метод дифференциального анализатора</h2>
<label for="debugMode">Режим отладки:</label>
<select id="debugMode" class="form-select w-auto d-inline-block">
    <option value="off" selected>Отключен</option>
    <option value="on">Включен</option>
</select>
<canvas id="canvas" width="500" height="500"></canvas>
<br>
<button class="btn btn-primary mt-3" id="stepButton" hidden>Следующий пиксель</button>
<button class="btn btn-danger mt-3" id="clearButton">Очистить экран</button>
<script src="/js/common.js"></script>
<script src="/js/differentialAnalyzer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>giis-lab1</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h2>Графический интерфейс для построения отрезков</h2>

    <div class="form-group">
        <label for="drawMode" class="form-label">Метод построения отрезка</label>
        <select id="drawMode" class="form-select">
            <option value="diff" selected>Дифференциальный анализатор</option>
            <option value="brezenhem">Алгоритм Брезенхема</option>
            <option value="antialiasing">Метод устранения ступенчатости</option>
        </select>
    </div>

    <div class="form-group">
        <label for="debugMode" class="form-label">Режим отладки:</label>
        <select id="debugMode" class="form-select w-auto d-inline-block">
            <option value="off" selected>Отключен</option>
            <option value="on">Включен</option>
        </select>
    </div>

    <canvas id="canvas" width="500" height="500"></canvas>

    <div class="btn-group">
        <button class="btn btn-primary" id="stepButton" hidden>Следующий пиксель</button>
        <button class="btn btn-danger" id="clearButton">Очистить экран</button>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/differentialAnalyzer.js"></script>
</body>
</html>

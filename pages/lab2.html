<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second-Order Curves</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h2>Построение линий второго порядка</h2>

    <div class="form-group">
        <label for="curveType" class="form-label">Выберите тип кривой</label>
        <select id="curveType" class="form-select">
            <option value="ellipse" selected>Эллипс</option>
            <option value="parabola">Парабола</option>
            <option value="hyperbola">Гипербола</option>
        </select>
    </div>

    <div class="form-group">
        <label for="debugMode" class="form-label">Режим отладки:</label>
        <select id="debugMode" class="form-select w-auto d-inline-block">
            <option value="off" selected>Отключен</option>
            <option value="on">Включен</option>
        </select>
    </div>

    <canvas id="canvas" width="500" height="500"></canvas>

    <div class="btn-group">
        <button class="btn btn-primary" id="stepButton" hidden>Следующий шаг</button>
        <button class="btn btn-danger" id="clearButton">Очистить экран</button>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/lab2.js"></script>

</body>
</html>
